[project]
name = "paperdesk-backend"
version = "0.1.0"
description = "PaperDesk backend runnable skeleton for the 00/01 tutorial scope."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "FlagEmbedding>=1.3.3",
  "pymupdf>=1.24.0",
  "pymilvus[milvus_lite]>=2.5.0",
  "sentence-transformers>=3.0.0",
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "loguru>=0.7.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["skills/builtin/*/manifest.json", "skills/builtin/*/SKILL.md"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
